<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - TCAM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(216,248,74,0.1), transparent),
                linear-gradient(160deg, #0B0F14 0%, #141A22 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #F2F4F7;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            animation: popIn 0.6s cubic-bezier(.4,0,.2,1) both;
        }
        @keyframes popIn {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .error-code {
            font-family: 'Anton', Arial, sans-serif;
            font-size: 9rem;
            font-weight: 400;
            margin: 0;
            color: #D8F84A;
            text-shadow: 0 0 60px rgba(216,248,74,0.35);
        }
        .error-message {
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.4rem;
            margin: 1rem 0;
        }
        .error-description {
            font-size: 1rem;
            margin: 1rem 0;
            color: #8A94A6;
        }
        .home-button {
            display: inline-block;
            background: #D8F84A;
            color: #0B0F14;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-radius: 999px;
            margin-top: 2rem;
            transition: transform 0.25s cubic-bezier(.4,0,.2,1), box-shadow 0.25s ease, background 0.25s ease;
            border: none;
            box-shadow: 0 10px 26px rgba(216,248,74,0.25);
        }
        .home-button:hover {
            background: #e4ff6b;
            transform: translateY(-3px);
            box-shadow: 0 16px 36px rgba(216,248,74,0.4);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="https://tcam.in/" class="home-button">Return to Home</a>
    </div>
</body>
</html>
